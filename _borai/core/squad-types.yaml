# Squad Types Catalog
# Read by the Discovery phase (Step 1) to offer starting points when creating a squad.
# A type is NOT a ready-made squad: it pre-fills domain, formats and suggested agents,
# and the Architect still asks what is specific to the user's company.
#
# Format (keep it simple, no YAML features beyond these):
#   - one "key: value" per line
#   - inline lists:  [a, b]
#   - inline maps:   { pt-BR: "...", en: "..." }
# target_formats   -> ids of files in _borai/core/best-practices/
# suggested_agents -> ids of ready-made agents in agents/ (a hint for the Design phase)

types:
  - id: instagram-carrossel-noticias
    icon: "📸"
    name: { pt-BR: "Carrossel de Instagram a partir de notícias", en: "Instagram carousel from the news" }
    description: { pt-BR: "acha a notícia do dia, escolhe o ângulo, escreve os slides e gera as imagens", en: "finds the news of the day, picks the angle, writes the slides and generates the images" }
    domain: content
    target_formats: [instagram-feed]
    suggested_agents: [ig-carousel, ig-caption, ig-human]
    purpose: "Transformar notícias quentes do nicho em carrosséis de Instagram: pesquisar, escolher o ângulo, escrever os slides e gerar as imagens."

  - id: instagram-reels
    icon: "🎬"
    name: { pt-BR: "Reels de Instagram", en: "Instagram Reels" }
    description: { pt-BR: "da ideia ao roteiro com gancho pontuado, texto de tela e legenda", en: "from idea to script with a scored hook, on-screen text and caption" }
    domain: content
    target_formats: [instagram-reels]
    suggested_agents: [ig-reel, ig-caption, ig-human, ig-viral]
    purpose: "Transformar ideias em roteiros de Reels prontos para gravar, com gancho pontuado, texto de tela, ficha de tempo e legenda."

  - id: instagram-semana
    icon: "🗓️"
    name: { pt-BR: "Semana de Instagram", en: "Instagram week" }
    description: { pt-BR: "planeja a semana e roteiriza Reels, carrosséis e Stories", en: "plans the week and writes Reels, carousels and Stories" }
    domain: content
    target_formats: [instagram-reels, instagram-feed, instagram-stories]
    suggested_agents: [ig-plan, ig-reel, ig-carousel, ig-story, ig-caption, ig-human]
    purpose: "Planejar a semana de Instagram a partir do que aconteceu na empresa e produzir os Reels, carrosséis e Stories do plano."

  - id: youtube-para-instagram
    icon: "♻️"
    name: { pt-BR: "Do YouTube para o Instagram", en: "From YouTube to Instagram" }
    description: { pt-BR: "transforma um vídeo longo em cortes e posts", en: "turns a long video into clips and posts" }
    domain: content
    target_formats: [instagram-reels, youtube-shorts]
    suggested_agents: [ig-repurpose, ig-reel, ig-caption, ig-human]
    purpose: "Pegar um vídeo longo do YouTube (ou podcast, live) e transformar em cortes e posts independentes para o Instagram."

  - id: lancamento-infoproduto
    icon: "🚀"
    name: { pt-BR: "Lançamento de infoproduto", en: "Digital product launch" }
    description: { pt-BR: "página de vendas, mensagens de WhatsApp, e-mails e roteiros de CPL", en: "sales page, WhatsApp messages, emails and launch video scripts" }
    domain: content
    target_formats: [email-sales, whatsapp-broadcast, blog-post]
    suggested_agents: [ig-human]
    purpose: "Produzir os materiais de lançamento de um infoproduto: página de vendas, sequência de e-mails, mensagens de WhatsApp e roteiros de CPL."

  - id: linkedin-posts
    icon: "💼"
    name: { pt-BR: "Posts de LinkedIn", en: "LinkedIn posts" }
    description: { pt-BR: "posts e artigos com a voz da empresa", en: "posts and articles in the company's voice" }
    domain: content
    target_formats: [linkedin-post, linkedin-article]
    suggested_agents: [ig-human]
    purpose: "Escrever posts e artigos de LinkedIn com a voz da empresa, a partir de temas, notícias ou experiências reais."

  - id: tutoriais-com-prints
    icon: "📚"
    name: { pt-BR: "Tutoriais com prints", en: "Tutorials with screenshots" }
    description: { pt-BR: "passo a passo com capturas de tela para treinar a equipe", en: "step-by-step guides with screenshots to train the team" }
    domain: content
    target_formats: [blog-post]
    suggested_agents: []
    purpose: "Escrever tutoriais passo a passo com capturas de tela de sistemas e ferramentas, para treinamento de colaboradores."

  - id: monitor-concorrentes
    icon: "🔍"
    name: { pt-BR: "Monitor de concorrentes", en: "Competitor monitor" }
    description: { pt-BR: "acompanha concorrentes e entrega um relatório periódico", en: "tracks competitors and delivers a periodic report" }
    domain: research
    target_formats: []
    suggested_agents: []
    purpose: "Acompanhar os concorrentes (site, redes, preços, lançamentos) e entregar um relatório periódico com o que mudou e o que fazer."
